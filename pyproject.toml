[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tait"
version = "2.3.1"
description = "Lightweight NumPy-first local AI training for Termux and constrained devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Khartoum Ghoul"}]
license = {file = "LICENSE"}
keywords = ["termux", "android", "numpy", "llm", "gpt", "ai", "training"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]

dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
hf = ["numpy>=1.24", "datasets>=2.14"]
# Pinned exactly: huggingface_hub >= 0.32 depends on hf_xet, a Rust
# extension with no prebuilt wheel for Termux/Android, so pip falls
# back to a slow source build that can fail on a phone. 0.30.2 has no
# hf_xet dependency and still provides everything TAIT uses
# (HfApi.create_repo / upload_file), so publishing works with wheels only.
publish = ["huggingface_hub==0.30.2"]
test = ["numpy>=1.24", "pytest>=8"]

[project.scripts]
tait = "tait.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
