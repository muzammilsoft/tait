[train]
data = "examples/datasets/mixed.jsonl"
output = "artifacts/reasoning.npz"
epochs = 30
batch_size = 16
lr = 0.003
d_model = 32
d_ff = 64
vocab_size = 1000
bpe_sample_size = 3000
cache_dir = ".tait-cache"
checkpoint_every = 5
checkpoint_path = "checkpoint_latest.npz"
best_checkpoint_path = "checkpoint_best.npz"
validation_split = 0.1
patience = 7
min_delta = 0.001
early_stopping = true
reasoning = true
response_only_loss = true
seed = 42
no_wake_lock = false
