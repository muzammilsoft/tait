[train]
data = "examples/datasets/mixed.jsonl"
output = "artifacts/tiny.npz"
epochs = 3
batch_size = 4
lr = 0.003
d_model = 16
d_ff = 32
vocab_size = 400
bpe_sample_size = 300
max_seq_len = 96
checkpoint_every = 0
best_checkpoint_path = "checkpoint_best.npz"
validation_split = 0.1
patience = 3
min_delta = 0.001
early_stopping = true
reasoning = true
response_only_loss = true
seed = 42
cache_dir = ".tait-cache"
no_wake_lock = true
